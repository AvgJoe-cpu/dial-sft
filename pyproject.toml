[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dial-sft"
version = "0.1.0"
description = "Dialog SFT with MLM training"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "AvgJoe-cpu"},
]
dependencies = [
    "transformers",
    "datasets==3.4.0",
    "hydra-core>=1.3",
    "trl",
    "jinja2",
    "torchmetrics",
    "torch",
    "tensorboardX",
    "tensorboard",
    "typer[all]",

]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "pylint",
]

[tool.uv]
dev-dependencies = []

[tool.pylint.format]
max-line-length = 88
[tool.black]
line-length = 88
[tool.isort]
profile = "black"

[tool.hatch.build.targets.wheel]
packages = ["src"]
