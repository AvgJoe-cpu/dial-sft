[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dial-sft"
version = "0.1.0"
description = "Dialog SFT with MLM training"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "AvgJoe-cpu"},
]
dependencies = [
    "transformers",
    "datasets",
    "hydra-core>=1.3",
    "trl",
    "jinja2",
    "torchmetrics",
    "torch",
    "tensorboardX",
    "tensorboard",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "pylint",
    "pre-commit",
    "mypy",
]

[tool.uv]
dev-dependencies = []

[tool.pylint.format]
max-line-length = 88
[tool.black]
line-length = 88
[tool.isort]
profile = "black"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
files = ["src", "hydra_mdlm_sft.py"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E501"]
