name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        pip install -e ".[dev]" || pip install transformers datasets trl jinja2 torch torchmetrics tensorboardX huggingface_hub numpy
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py') --disable=C0114,C0115,C0116,C0301,C0303,C0304,C0410,C0411,C0415,R0902,R0903,R0913,R0915,R0917,W0614
      continue-on-error: true