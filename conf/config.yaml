defaults:
  - _self_
  - model: mdlm_0_2b
  - stage: d0          # default stage; override with `stage=d1|d2|d3`

seed: 42

paths:
  # stage-specific train path is set in conf/stage/*.yaml
  test_data:  "./datasets/base/writingprompts_eval" # HPO test set: real test has _test suffix, but we want to use the same eval set for all stages
  model_load: "./weights/base"
  model_save: "./weights/checkpoints/${stage_name}"
  log_dir:    "./runs/pilot/${stage_name}"

dataset:
  num_workers:      4
  max_length:       1024                  # ∈ {512, 768, 1024}
  id_field:         "id"

training:
  num_epochs:    1
  batch_size:    64
  learning_rate: 5.0e-5
  weight_decay:  0.01
  warmup_ratio:  0.03
  grad_clip:     1.0
  logging_steps: 50
  adam_beta1:    0.9
  adam_beta2:    0.999

eval:
  strategy:      "steps"
  steps:         100
  save_strategy: "no"
  metric:        "masked_lm_loss"
  report_to:
    - "tensorboard"

# filled by stage configs
stage_name: "stage0"
